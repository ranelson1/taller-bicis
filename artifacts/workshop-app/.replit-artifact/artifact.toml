kind = "web"
previewPath = "/"
title = "Taller de Bicicletas"
version = "1.0.0"
id = "artifacts/workshop-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25504

[services.development]
run = "pnpm --filter @workspace/workshop-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/workshop-app", "run", "build" ]
publicDir = "artifacts/workshop-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25504"
BASE_PATH = "/"
