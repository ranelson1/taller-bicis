components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ── AUTH ────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, mechanic, reception, superadmin]
        workshopId:
          type: ["integer", "null"]
          description: Taller de la sesión (null = superadmin sin taller elegido)
        workshopName:
          type: ["string", "null"]
        workshopLogoUrl:
          type: ["string", "null"]
        doesJobs:
          type: boolean

    # ── USERS ────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, name, email, role, active, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, mechanic, reception]
        weeklyHours:
